<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toán Lớp 1: Khám Phá Số Từ 6 Đến 10</title>
    <style>
      :root {
        --primary: #4361ee;
        --primary-light: #4895ef;
        --success: #2ec4b6;
        --danger: #e71d36;
        --warning: #ff9f1c;
        --dark: #2b2d42;
        --light: #f8f9fa;
        --card-bg: #ffffff;
      }

      * {
        box-sizing: border-box;
        font-family: "Nunito", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #e0f7fa 0%, #bbdefb 100%);
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
      }

      .dashboard-container {
        background: var(--card-bg);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        max-width: 750px;
        width: 100%;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.9);
      }

      /* Header */
      .dash-header {
        background: linear-gradient(
          90deg,
          var(--primary),
          var(--primary-light)
        );
        color: white;
        padding: 20px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .dash-header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      .badge-info {
        background: rgba(255, 255, 255, 0.25);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 700;
      }

      /* Khung nội dung chính */
      .content-body {
        padding: 30px;
      }

      /* Thống kê & Tiến trình */
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
      }

      .stat-card {
        background: var(--light);
        padding: 12px 20px;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        border-left: 5px solid var(--primary);
      }

      .stat-card span:first-child {
        font-size: 12px;
        color: #6c757d;
        font-weight: 700;
        text-transform: uppercase;
      }

      .stat-card span:last-child {
        font-size: 20px;
        color: var(--dark);
        font-weight: 800;
      }

      .progress-track {
        background: #e9ecef;
        height: 12px;
        border-radius: 6px;
        margin-bottom: 25px;
        overflow: hidden;
      }

      .progress-fill {
        background: var(--success);
        height: 100%;
        width: 0%;
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Vùng câu hỏi */
      .question-panel {
        background: #f8faff;
        border: 2px dashed #cbd5e1;
        border-radius: 18px;
        padding: 20px 25px;
        margin-bottom: 25px;
        text-align: center;
      }

      .question-title {
        font-size: 20px;
        color: var(--dark);
        font-weight: 800;
        line-height: 1.5;
        margin: 0 0 12px 0;
      }

      .visual-box {
        font-size: 36px;
        letter-spacing: 6px;
        background: #ffffff;
        padding: 14px 20px;
        border-radius: 14px;
        display: inline-block;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
        border: 1px solid #e2e8f0;
        line-height: 1.4;
      }

      /* Các lựa chọn */
      .options-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }

      .opt-btn {
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        padding: 15px 20px;
        font-size: 18px;
        color: var(--dark);
        font-weight: 700;
        cursor: pointer;
        text-align: left;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .opt-btn:hover:not(:disabled) {
        border-color: var(--primary-light);
        background: #f0f4ff;
        transform: translateY(-2px);
      }

      .opt-btn.correct {
        background: #e6fcf5 !important;
        border-color: var(--success) !important;
        color: #0ca678 !important;
      }

      .opt-btn.wrong {
        background: #fff5f5 !important;
        border-color: var(--danger) !important;
        color: #e03131 !important;
      }

      .opt-btn:disabled {
        cursor: default;
      }

      /* Phản hồi & Nút tiếp theo */
      .footer-action {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #edf2f7;
        padding-top: 20px;
        min-height: 65px;
      }

      .feedback-text {
        font-weight: 700;
        font-size: 16px;
        max-width: 65%;
      }

      .action-btn {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 26px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
        display: none;
      }

      .action-btn:hover {
        background: #3a0ca3;
      }

      .action-btn:active {
        transform: scale(0.98);
      }

      /* Màn hình kết quả */
      .result-view {
        text-align: center;
        padding: 25px 10px;
        display: none;
      }

      .result-icon {
        font-size: 68px;
        margin-bottom: 10px;
      }

      .score-badge {
        font-size: 36px;
        font-weight: 800;
        color: var(--primary);
        margin: 15px 0;
      }

      .result-desc {
        font-size: 17px;
        color: #4a5568;
        margin-bottom: 25px;
        line-height: 1.6;
      }

      @media (max-width: 600px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }
        .dash-header {
          flex-direction: column;
          gap: 10px;
          text-align: center;
        }
        .visual-box {
          font-size: 28px;
          letter-spacing: 3px;
        }
        .footer-action {
          flex-direction: column;
          gap: 12px;
          text-align: center;
        }
        .feedback-text {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Header -->
      <div class="dash-header">
        <h1>🎈 TOÁN LỚP 1: SỐ TỪ 6 ĐẾN 10</h1>
        <div class="badge-info" id="current-stage">Vui Học Cùng Bé</div>
      </div>

      <!-- Màn hình làm trắc nghiệm -->
      <div class="content-body" id="quiz-view">
        <div class="stats-grid">
          <div class="stat-card">
            <span>Câu hỏi hiện tại</span>
            <span id="q-counter">01 / 10</span>
          </div>
          <div class="stat-card" style="border-left-color: var(--warning)">
            <span>Sao thưởng của bé</span>
            <span id="score-counter">0 ⭐</span>
          </div>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="progress-bar"></div>
        </div>

        <div class="question-panel">
          <p class="question-title" id="q-text">Đang tải câu hỏi...</p>
          <div class="visual-box" id="q-visual"></div>
        </div>

        <div class="options-grid" id="options-box"></div>

        <div class="footer-action">
          <div class="feedback-text" id="feedback-msg"></div>
          <button class="action-btn" id="next-step-btn" onclick="proceedNext()">
            Câu tiếp theo ➔
          </button>
        </div>
      </div>

      <!-- Màn hình tổng kết kết quả -->
      <div class="content-body result-view" id="result-view">
        <div class="result-icon">🏆</div>
        <h2>HOAN HÔ BÉ ĐÃ HOÀN THÀNH!</h2>
        <div class="score-badge" id="final-score-text">10 / 10 ⭐</div>
        <p class="result-desc" id="result-comment-text">
          Bé thật giỏi! Bé đã nhận biết và đếm rất chính xác các số từ 6 đến 10.
        </p>
        <button
          class="action-btn"
          style="display: inline-block"
          onclick="resetQuizSession()"
        >
          Chơi lại từ đầu 🔄
        </button>
      </div>
    </div>

    <script>
      // Bộ 10 câu hỏi Toán lớp 1: Nhận biết số từ 6 đến 10
      const quizDatabase = [
        {
          q: "Câu 1: Bé hãy đếm xem có tất cả bao nhiêu quả táo đỏ nhé?",
          visual: "🍎 🍎 🍎 🍎 🍎 🍎",
          opts: ["A. 6 quả táo", "B. 5 quả táo", "C. 7 quả táo"],
          ans: 0,
          note: "Có tất cả 6 quả táo đỏ (đọc là sáu).",
        },
        {
          q: "Câu 2: Trong dãy số tăng dần từ 6 đến 10, số nào đứng ngay sau số 7?",
          visual: "6 ➔ 7 ➔ ❓ ➔ 9 ➔ 10",
          opts: ["A. Số 6", "B. Số 8", "C. Số 9"],
          ans: 1,
          note: "Đếm theo thứ tự: 6, 7, 8, 9, 10 nên số 8 đứng ngay sau số 7.",
        },
        {
          q: "Câu 3: Có bao nhiêu ngôi sao vàng đang tỏa sáng trên bầu trời?",
          visual: "⭐ ⭐ ⭐ ⭐ ⭐<br>⭐ ⭐ ⭐ ⭐",
          opts: ["A. 8 ngôi sao", "B. 10 ngôi sao", "C. 9 ngôi sao"],
          ans: 2,
          note: "Hàng trên có 5 ngôi sao, hàng dưới có 4 ngôi sao. Tất cả là 9 ngôi sao.",
        },
        {
          q: "Câu 4: Số nào được đọc là 'Mười' và gồm hai chữ số ghép lại?",
          visual: "🔢 6️⃣  7️⃣  8️⃣  9️⃣  🔟",
          opts: ["A. Số 10", "B. Số 8", "C. Số 9"],
          ans: 0,
          note: "Số 10 đọc là 'mười', gồm chữ số 1 đứng trước và chữ số 0 đứng sau.",
        },
        {
          q: "Câu 5: Đếm số chú cá nhỏ đang bơi dưới nước nào bé ơi!",
          visual: "🐠 🐠 🐠 🐠<br>🐠 🐠 🐠",
          opts: ["A. 6 chú cá", "B. 7 chú cá", "C. 8 chú cá"],
          ans: 1,
          note: "Có tất cả 7 chú cá (4 chú ở trên và 3 chú ở dưới).",
        },
        {
          q: "Câu 6: Trong các số sau đây, số nào là số LỚN NHẤT?",
          visual: "⚖️  6   —   9   —   7",
          opts: ["A. Số 6", "B. Số 7", "C. Số 9"],
          ans: 2,
          note: "Trong các số 6, 9, 7 thì 9 là số lớn nhất.",
        },
        {
          q: "Câu 7: Bé hãy đếm xem trên bàn có bao nhiêu chiếc bánh kem?",
          visual: "🧁 🧁 🧁 🧁 🧁<br>🧁 🧁 🧁 🧁 🧁",
          opts: ["A. 9 chiếc bánh", "B. 10 chiếc bánh", "C. 8 chiếc bánh"],
          ans: 1,
          note: "Mỗi hàng có 5 chiếc bánh, 2 hàng có tất cả 10 chiếc bánh kem.",
        },
        {
          q: "Câu 8: Số 8 là số đứng liền trước của số nào?",
          visual: "❓ ➔ 8 ➔ ❓",
          opts: ["A. Số 7", "B. Số 9", "C. Số 10"],
          ans: 1,
          note: "Số 8 đứng ngay trước số 9 (8 rồi đến 9).",
        },
        {
          q: "Câu 9: Nhóm hình nào dưới đây có số lượng bằng 8?",
          visual: "🍓🍓🍓🍓🍓🍓🍓🍓",
          opts: ["A. 8 quả dâu tây", "B. 6 quả dâu tây", "C. 10 quả dâu tây"],
          ans: 0,
          note: "Đếm từ trái sang phải có đúng 8 quả dâu tây.",
        },
        {
          q: "Câu 10: Trong các số từ 6 đến 10, số nào là số BÉ NHẤT?",
          visual: "🎯 6 , 7 , 8 , 9 , 10",
          opts: ["A. Số 10", "B. Số 7", "C. Số 6"],
          ans: 2,
          note: "Số 6 đứng đầu dãy từ 6 đến 10 nên 6 là số bé nhất.",
        },
      ];

      let currentIdx = 0;
      let earnedPoints = 0;

      const qCounterEl = document.getElementById("q-counter");
      const scoreCounterEl = document.getElementById("score-counter");
      const progressBarEl = document.getElementById("progress-bar");
      const qTextEl = document.getElementById("q-text");
      const qVisualEl = document.getElementById("q-visual");
      const optionsBoxEl = document.getElementById("options-box");
      const feedbackMsgEl = document.getElementById("feedback-msg");
      const nextStepBtnEl = document.getElementById("next-step-btn");

      const quizViewEl = document.getElementById("quiz-view");
      const resultViewEl = document.getElementById("result-view");

      function renderQuestion() {
        let currentItem = quizDatabase[currentIdx];
        let formattedNum =
          currentIdx + 1 < 10 ? `0${currentIdx + 1}` : `${currentIdx + 1}`;
        qCounterEl.innerText = `${formattedNum} / ${quizDatabase.length}`;
        progressBarEl.style.width = `${(currentIdx / quizDatabase.length) * 100}%`;
        qTextEl.innerText = currentItem.q;
        qVisualEl.innerHTML = currentItem.visual;

        optionsBoxEl.innerHTML = "";
        feedbackMsgEl.innerText = "";
        nextStepBtnEl.style.display = "none";

        currentItem.opts.forEach((optionText, optIndex) => {
          let btn = document.createElement("button");
          btn.className = "opt-btn";
          btn.innerHTML = `<span>${optionText}</span>`;
          btn.onclick = () => evaluateAnswer(optIndex, btn);
          optionsBoxEl.appendChild(btn);
        });
      }

      function evaluateAnswer(selectedIndex, selectedButton) {
        let currentItem = quizDatabase[currentIdx];
        let allOptButtons = optionsBoxEl.querySelectorAll(".opt-btn");

        allOptButtons.forEach((b) => (b.disabled = true));

        if (selectedIndex === currentItem.ans) {
          selectedButton.classList.add("correct");
          feedbackMsgEl.innerText = `✨ Đúng rồi! ${currentItem.note}`;
          feedbackMsgEl.style.color = "var(--success)";
          earnedPoints++;
          scoreCounterEl.innerText = `${earnedPoints} ⭐`;
        } else {
          selectedButton.classList.add("wrong");
          allOptButtons[currentItem.ans].classList.add("correct");
          feedbackMsgEl.innerText = `💡 Chưa đúng rồi! ${currentItem.note}`;
          feedbackMsgEl.style.color = "var(--danger)";
        }

        progressBarEl.style.width = `${((currentIdx + 1) / quizDatabase.length) * 100}%`;
        nextStepBtnEl.style.display = "block";
      }

      function proceedNext() {
        currentIdx++;
        if (currentIdx < quizDatabase.length) {
          renderQuestion();
        } else {
          showFinalDashboard();
        }
      }

      function showFinalDashboard() {
        quizViewEl.style.display = "none";
        resultViewEl.style.display = "block";
        document.getElementById("final-score-text").innerText =
          `${earnedPoints} / ${quizDatabase.length} ⭐`;

        let commentText = document.getElementById("result-comment-text");
        if (earnedPoints >= 9) {
          commentText.innerText =
            "Xuất sắc quá bé ơi! Bé đã đếm và nhận biết thành thạo tất cả các số từ 6 đến 10!";
        } else if (earnedPoints >= 6) {
          commentText.innerText =
            "Bé làm khá tốt rồi! Hãy thử chơi lại một lần nữa để đạt trọn vẹn 10 ngôi sao nhé!";
        } else {
          commentText.innerText =
            "Cố lên bé nhé! Bé hãy đếm thật chậm từng hình và thử sức lại từ đầu nào!";
        }
      }

      function resetQuizSession() {
        currentIdx = 0;
        earnedPoints = 0;
        scoreCounterEl.innerText = `0 ⭐`;
        quizViewEl.style.display = "block";
        resultViewEl.style.display = "none";
        renderQuestion();
      }

      // Khởi chạy câu hỏi đầu tiên
      renderQuestion();
    </script>
  </body>
</html>
